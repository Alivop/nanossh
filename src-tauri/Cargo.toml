[package]
name = "nanossh"
version = "1.0.0"
description = "NanoSSH - 跨平台多页签 SSH 客户端"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanossh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "=0.64.1"
base64 = "0.22"
anyhow = "1"
aes-gcm = "0.10"
rand = "0.8"
portable-pty = "0.9"
russh-sftp = "=2.4.0"
tauri-plugin-dialog = "2"
